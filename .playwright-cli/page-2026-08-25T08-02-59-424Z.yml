  - generic [ref=e27]:
    - paragraph [ref=e28]: Ask Kisan
    - paragraph [ref=e30]: For irrigating rice during the Kharif season, maintain shallow standing water throughout the vegetative growth stage to ensure adequate moisture. However, avoid prolonged excessive water; if there is heavy rainfall causing too much standing water, drain the excess promptly to prevent damage. Before harvest, drain the field to allow the soil to dry. Also, ensure your nursery area is well-drained with access to water, and after transplanting healthy seedlings, keep the soil suitably moist but not waterlogged. This irrigation management helps support healthy growth and good yield. For specific local conditions, please consult your nearby agricultural officer.
