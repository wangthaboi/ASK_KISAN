services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ask-kisan-backend:latest
    container_name: ask-kisan-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PORT=${PORT:-8000}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${PORT:-8000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

